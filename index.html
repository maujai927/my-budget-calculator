<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f5f1; --card:#ffffff; --ink:#14221d; --mute:#5d6b65; --line:#dde4de;
  --needs:#1f5c4b; --wants:#e3a72f; --save:#3f8fb5; --left:#d3dbd5; --bad:#c2452d; --field:#f7f9f6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714; --card:#17221e; --ink:#e8efe9; --mute:#93a39b; --line:#26352f;
    --needs:#4fb596; --wants:#e8b84a; --save:#68b2d6; --left:#2c3b35; --bad:#ec7a63; --field:#1c2924;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714; --card:#17221e; --ink:#e8efe9; --mute:#93a39b; --line:#26352f;
  --needs:#4fb596; --wants:#e8b84a; --save:#68b2d6; --left:#2c3b35; --bad:#ec7a63; --field:#1c2924;
}
html{height:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;min-height:100vh}
.display{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.field{background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:.6rem .75rem;width:100%;min-width:0}
.field:focus,.btn:focus-visible,select:focus{outline:2px solid var(--needs);outline-offset:1px}
.btn{border-radius:12px;padding:.6rem 1rem;font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.97)}
.seg{transition:width .45s cubic-bezier(.3,.8,.3,1)}
.row{display:grid;grid-template-columns:1fr 7.5rem;gap:.5rem;align-items:center}
@media(min-width:640px){.row{grid-template-columns:1fr 6.5rem 7rem 2.25rem}}
.rowact{display:contents}
.del{color:var(--mute);border-radius:10px;height:2.25rem;width:2.25rem}
.del:hover{color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.new{animation:pop .25s ease}
@media(prefers-reduced-motion:reduce){.seg,.new{transition:none;animation:none}}
</style>
</head>
<body>
<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
  <header class="flex items-start justify-between gap-4 mb-8">
    <div>
      <h1 class="display text-3xl sm:text-4xl font-bold">Where does your month go?</h1>
      <p class="mt-2 text-[var(--mute)] max-w-md">Enter your income, list what you spend, and see how it splits across needs, wants and savings.</p>
    </div>
    <div class="flex gap-2 shrink-0">
      <select id="cur" aria-label="Currency" class="field !w-auto !py-2">
        <option value="£">£</option><option value="$">$</option><option value="€">€</option>
      </select>
      <button id="theme" class="btn card !rounded-xl" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="grid lg:grid-cols-[1fr_380px] gap-6 items-start">
    <section class="space-y-6">
      <div class="card p-5 sm:p-6">
        <label for="income" class="font-semibold">Monthly income after tax</label>
        <div class="relative mt-2">
          <span id="sym" class="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--mute)]">£</span>
          <input id="income" type="number" min="0" step="any" inputmode="decimal" placeholder="0" class="field !pl-8 display text-2xl font-bold">
        </div>
      </div>

      <div class="card p-5 sm:p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="display text-xl font-bold">Expenses</h2>
          <button id="add" class="btn text-white" style="background:var(--needs)">Add expense</button>
        </div>
        <div id="list" class="space-y-2"></div>
        <p id="empty" class="hidden text-[var(--mute)] py-6 text-center">No expenses yet. Add your first one to start the breakdown.</p>
      </div>
    </section>

    <aside class="card p-5 sm:p-6 lg:sticky lg:top-6" aria-live="polite">
      <p class="text-[var(--mute)] text-sm">Left over this month</p>
      <p id="left" class="display text-5xl font-bold mt-1">£0</p>
      <p id="note" class="text-sm text-[var(--mute)] mt-1">Add income to begin.</p>

      <div class="mt-6 h-5 rounded-full overflow-hidden flex" style="background:var(--left)" role="img" aria-label="Budget split">
        <div id="b-needs" class="seg h-full" style="width:0;background:var(--needs)"></div>
        <div id="b-wants" class="seg h-full" style="width:0;background:var(--wants)"></div>
        <div id="b-save" class="seg h-full" style="width:0;background:var(--save)"></div>
      </div>

      <div class="mt-6 space-y-4" id="stats"></div>

      <div class="mt-6 pt-4 border-t border-[var(--line)] grid grid-cols-2 gap-3 text-sm">
        <div><p class="text-[var(--mute)]">Total spent</p><p id="spent" class="display text-xl font-bold">£0</p></div>
        <div><p class="text-[var(--mute)]">Savings rate</p><p id="rate" class="display text-xl font-bold">0%</p></div>
      </div>
      <button id="reset" class="btn w-full mt-5 border border-[var(--line)] text-[var(--mute)]">Reset everything</button>
    </aside>
  </div>
</main>

<script>
const TYPES={needs:{label:'Needs',target:50,v:'--needs'},wants:{label:'Wants',target:30,v:'--wants'},save:{label:'Savings',target:20,v:'--save'}};
const DEFAULT=[
  {n:'Rent or mortgage',a:'',t:'needs'},{n:'Groceries',a:'',t:'needs'},{n:'Utilities',a:'',t:'needs'},
  {n:'Eating out',a:'',t:'wants'},{n:'Emergency fund',a:'',t:'save'}
];
let S={income:'',cur:'£',items:JSON.parse(JSON.stringify(DEFAULT))};
try{const r=localStorage.getItem('budget-v1');if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.items))S=p}}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('budget-v1',JSON.stringify(S))}catch(e){}};
const fmt=n=>{const neg=n<0;return (neg?'-':'')+S.cur+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:0})};
const num=v=>parseFloat(v)||0;

function buildRows(fresh){
  const list=$('list');list.innerHTML='';
  S.items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='row'+(fresh===i?' new':'');
    d.innerHTML=`<input class="field" aria-label="Expense name" placeholder="Name" value="">
      <input class="field" type="number" min="0" step="any" inputmode="decimal" aria-label="Amount" placeholder="0">
      <select class="field" aria-label="Type">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}">${t.label}</option>`).join('')}</select>
      <button class="del btn" aria-label="Remove expense">✕</button>`;
    const [nm,am,ty,de]=d.children;
    nm.value=it.n;am.value=it.a;ty.value=it.t;
    nm.oninput=()=>{it.n=nm.value;save()};
    am.oninput=()=>{it.a=am.value;update()};
    ty.onchange=()=>{it.t=ty.value;update()};
    de.onclick=()=>{S.items.splice(i,1);buildRows();update()};
    list.appendChild(d);
  });
  $('empty').classList.toggle('hidden',S.items.length>0);
}

function update(){
  const inc=num(S.income);
  const sums={needs:0,wants:0,save:0};
  S.items.forEach(i=>sums[i.t]+=num(i.a));
  const spent=sums.needs+sums.wants+sums.save;
  const left=inc-spent;
  $('sym').textContent=S.cur;
  const L=$('left');L.textContent=fmt(left);L.style.color=left<0?'var(--bad)':'var(--ink)';
  $('note').textContent=inc<=0?'Add income to begin.':left<0?`You're over budget by ${fmt(-left)}.`:left===0?'Every pound is assigned.'.replace('pound',S.cur==='£'?'pound':'unit'):`${Math.round(left/inc*100)}% of income is unassigned.`;
  const base=Math.max(inc,spent,1);
  for(const k of ['needs','wants','save'])$('b-'+k).style.width=(sums[k]/base*100)+'%';
  $('stats').innerHTML=Object.entries(TYPES).map(([k,t])=>{
    const pct=inc>0?sums[k]/inc*100:0;
    const over=k!=='save'&&pct>t.target;
    const under=k==='save'&&inc>0&&pct<t.target;
    const hint=inc<=0?`Target ${t.target}%`:over?`${Math.round(pct-t.target)} pts over target`:under?`${Math.round(t.target-pct)} pts under target`:`On target (${t.target}%)`;
    return `<div><div class="flex justify-between items-baseline">
      <span class="flex items-center gap-2 font-semibold"><i class="inline-block w-3 h-3 rounded-full" style="background:var(${t.v})"></i>${t.label}</span>
      <span class="display font-bold">${fmt(sums[k])} <span class="text-[var(--mute)] text-sm font-medium">${Math.round(pct)}%</span></span></div>
      <div class="relative h-1.5 mt-2 rounded-full" style="background:var(--left)">
        <div class="seg h-full rounded-full" style="width:${Math.min(pct/t.target*100,100)}%;background:var(${t.v})"></div></div>
      <p class="text-xs mt-1 ${over||under?'':'text-[var(--mute)]'}" style="${over||under?'color:var(--bad)':''}">${hint}</p></div>`;
  }).join('');
  $('spent').textContent=fmt(spent);
  $('rate').textContent=inc>0?Math.round(Math.max(0,(inc-sums.needs-sums.wants)/inc*100))+'%':'0%';
  save();
}

$('income').value=S.income;$('cur').value=S.cur;
$('income').oninput=e=>{S.income=e.target.value;update()};
$('cur').onchange=e=>{S.cur=e.target.value;update()};
$('add').onclick=()=>{S.items.push({n:'',a:'',t:'needs'});buildRows(S.items.length-1);update();const r=$('list').lastChild;r&&r.firstChild.focus()};
$('reset').onclick=()=>{if(confirm('Clear income and reset all expenses?')){S={income:'',cur:S.cur,items:JSON.parse(JSON.stringify(DEFAULT))};$('income').value='';buildRows();update()}};
$('theme').onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};
buildRows();update();
</script>
</body>
</html>
